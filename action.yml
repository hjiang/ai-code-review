name: 'AI Code Review'
description: 'LLM-powered PR summaries and inline code review comments using any OpenAI/Anthropic-compatible provider'
inputs:
  mode:
    description: 'summary | review | both'
    default: 'review'
    required: false
  github_token:
    description: 'GitHub token; needs pull-requests: write (review mode) and issues: write (summary mode)'
    default: '${{ github.token }}'
    required: false
  api_base_url:
    description: 'LLM API base URL'
    required: true
  api_key:
    description: 'LLM API key'
    required: true
  model:
    description: 'Model name'
    required: true
  provider:
    description: 'openai | anthropic | auto'
    default: 'auto'
    required: false
  max_tokens:
    description: 'Completion token budget'
    default: '8192'
    required: false
  temperature:
    description: 'Sampling temperature. Default 0.2 for OpenAI-compatible providers; unset (provider default) for Anthropic, whose 4.7+/5.x models reject any non-default value with a 400 — set it explicitly only if your model allows it.'
    default: ''
    required: false
  thinking:
    description: 'Thinking effort: auto | off | low | medium | high | max (default auto = built-in behavior, i.e. DeepSeek flash pinned on at low effort). Maps per provider — DeepSeek/OpenAI-style: sends reasoning_effort (off = explicit DeepSeek disable); Anthropic: adaptive thinking + output_config.effort on 4.6+/5.x, falling back to extended thinking with budget_tokens derived from max_tokens (20/35/50/70% per level) on Claude 4.5 and earlier. Thinking tokens count against max_tokens (raise it) and thinking is slow (consider timeout: 0). extra_body is merged last and wins, so a level combined with an extra_body that disables thinking (or off with one that enables it) is rejected as contradictory. Gateways with their own knob (e.g. OpenRouter reasoning) stay on extra_body.'
    default: 'auto'
    required: false
  timeout:
    description: 'Deadline in seconds for the whole LLM call, across all retries and re-asks (default 300). Set 0 for no client-side cap — for very long model thinking. Responses stream (SSE), so long generations survive idle-connection drops; a stream producing no bytes for 5 minutes is treated as stalled and retried. With 0, the request is bounded only by provider limits and your job timeout. Long thinking also needs token headroom: raise max_tokens; use the thinking input to pick the effort (or extra_body for provider-specific knobs). A rejected extra_body is dropped once and the request retried.'
    default: '300'
    required: false
  response_format:
    description: 'Send response_format json_object to the provider. auto: send it, retry once without it on an empty/rejected completion (recommended default; reasoning models may need it off). off: never send it.'
    default: 'auto'
    required: false
  extra_body:
    description: 'Optional JSON object merged into the LLM request body (user keys win). DeepSeek base URLs default to {"thinking":{"type":"enabled"},"reasoning_effort":"low"}; override e.g. with {"thinking":{"type":"disabled"}}. Retried once without it if the provider rejects it with 400.'
    default: ''
    required: false
  exclude:
    description: 'Extra glob excludes (comma or newline separated)'
    default: ''
    required: false
  max_files:
    description: 'Maximum files reviewed per run'
    default: '40'
    required: false
  max_patch_chars:
    description: 'Total diff characters sent to the LLM per chunk (also the per-file patch cap)'
    default: '100000'
    required: false
  review_drafts:
    description: 'Review draft PRs'
    default: 'false'
    required: false
  comment_trigger:
    description: 'Issue comment text that triggers a review'
    default: '/review'
    required: false
  pr_number:
    description: 'PR number (workflow_dispatch only)'
    default: ''
    required: false
  fail_on_error:
    description: 'Fail the workflow if the action errors'
    default: 'false'
    required: false
outputs:
  summary_posted:
    description: '"true" if a summary comment was posted this run'
  review_comment_count:
    description: 'Number of inline comments posted'
  files_reviewed:
    description: 'Number of files reviewed'
runs:
  using: 'node24'
  main: 'dist/index.js'
